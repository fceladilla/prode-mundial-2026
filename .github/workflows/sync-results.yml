# Sincroniza resultados desde football-data.org durante el Mundial
# (11 jun - 19 jul 2026) y evalua los pronosticos.
#
# El Mundial termino (final 19 jul 2026): el schedule automatico esta
# desactivado para no seguir consultando la API ni gastando cuota de Firestore.
# Se deja workflow_dispatch por si hace falta correrlo a mano.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   FOOTBALL_DATA_API_KEY     token de football-data.org (plan gratuito)
#   FIREBASE_SERVICE_ACCOUNT  JSON de la service account en una sola linea
name: Sync resultados

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync resultados y evaluar pronosticos
        run: npx tsx scripts/syncResults.ts
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
